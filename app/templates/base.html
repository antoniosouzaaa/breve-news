<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}BREVE. Resumo Matinal{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d0f12;
      color: #e5e7eb;
    }
    .font-serif {
      font-family: 'Newsreader', serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center selection:bg-neutral-800">
  
  <main class="w-full max-w-md px-5 pt-8 pb-28">
    {% block content %}{% endblock %}
  </main>

  <!-- Bottom Navigation Bar fixa para Mobile -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#12151b]/90 backdrop-blur-md border-t border-neutral-800/80">
    <div class="max-w-md mx-auto px-6 h-16 flex items-center justify-around">
      <a href="/" class="flex flex-col items-center gap-1 text-xs font-medium {% if request.url.path == '/' %}text-orange-500{% else %}text-neutral-400 hover:text-neutral-200{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        Hoje
      </a>
      <a href="/arquivo" class="flex flex-col items-center gap-1 text-xs font-medium {% if request.url.path == '/arquivo' %}text-orange-500{% else %}text-neutral-400 hover:text-neutral-200{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Histórico
      </a>
      <button onclick="triggerUpdate()" id="updateBtn" class="flex flex-col items-center gap-1 text-xs font-medium text-neutral-400 hover:text-neutral-200">
        <svg id="updateSpinner" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span id="updateText">Atualizar</span>
      </button>
    </div>
  </nav>

  <script>
    async function triggerUpdate() {
      if(!confirm("Deseja buscar notícias e sintetizar com IA agora? Isso leva cerca de 10 a 20 segundos.")) return;
      const btn = document.getElementById('updateBtn');
      const text = document.getElementById('updateText');
      const icon = document.getElementById('updateSpinner');
      if(btn) btn.disabled = true;
      if(text) text.innerText = 'Processando...';
      if(icon) icon.classList.add('animate-spin');

      try {
        const res = await fetch('/api/trigger?force=true', {method: 'POST'});
        if(res.ok) {
          window.location.reload();
        } else {
          alert("Erro ao disparar atualização.");
          if(btn) btn.disabled = false;
          if(text) text.innerText = 'Atualizar';
          if(icon) icon.classList.remove('animate-spin');
        }
      } catch (e) {
        alert("Erro na requisição: " + e);
        if(btn) btn.disabled = false;
        if(text) text.innerText = 'Atualizar';
        if(icon) icon.classList.remove('animate-spin');
      }
    }
  </script>
</body>
</html>
