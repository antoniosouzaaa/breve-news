<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>{% block title %}BREVE. — Resumo Matinal{% endblock %}</title>
  <meta name="description" content="Briefing jornalístico matinal, minimalista e curado por IA com foco em Cultura, Economia, F1, Design e Geral. Sem ruído, direto ao ponto.">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171715" media="(prefers-color-scheme: dark)">

  <!-- Script anti-FOUC para evitar flash de tema incorreto -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('breve_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Tipografia: Instrument Serif (Editorial) + Inter (Interface & Leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       BREVE. 2.0 — DESIGN SYSTEM TOKENS (Quiet Editorial)
       ========================================================================== */
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --color-background: #FAF9F6;
      --color-surface: #FFFFFF;
      --color-surface-secondary: #F1EFE9;
      --color-text-primary: #201F1C;
      --color-text-secondary: #66635D;
      --color-text-tertiary: #817D75;
      --color-border: #E4E0D8;
      --color-border-subtle: #ECE8E0;
      --color-accent: #B94D2D;
      --color-accent-hover: #963B22;
      --color-accent-soft: #F5E8E1;
      --color-success: #286846;
      --color-danger: #B42318;
      --color-focus-ring: #1769AA;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --color-background: #171715;
      --color-surface: #20201D;
      --color-surface-secondary: #292823;
      --color-text-primary: #F2F0E9;
      --color-text-secondary: #B7B3A9;
      --color-text-tertiary: #969187;
      --color-border: #383730;
      --color-border-subtle: #2A2925;
      --color-accent: #E58A69;
      --color-accent-hover: #F0A184;
      --color-accent-soft: #382720;
      --color-success: #82C99C;
      --color-danger: #FF8A80;
      --color-focus-ring: #8BC5FF;
    }

    /* Regras Globais */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--color-background);
      color: var(--color-text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    ::selection {
      background-color: var(--color-accent-soft);
      color: var(--color-accent);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--color-focus-ring);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* Tipografia Especial */
    .font-serif {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
    }

    /* Layout Container */
    .editorial-container {
      width: 100%;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    @media (max-width: 360px) {
      .editorial-container {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    /* Cabeçalho */
    .site-header {
      width: 100%;
      border-bottom: 1px solid var(--color-border);
      background-color: var(--color-background);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .site-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .brand-logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-text-primary);
      display: inline-flex;
      align-items: baseline;
      user-select: none;
    }

    .brand-dot {
      color: var(--color-accent);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pill {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--color-text-secondary);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
    }

    .nav-pill:hover {
      color: var(--color-text-primary);
      background-color: var(--color-surface-secondary);
    }

    .nav-pill.active {
      color: var(--color-text-primary);
      background-color: var(--color-surface-secondary);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--color-text-secondary);
      transition: color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--color-text-primary);
      background-color: var(--color-surface-secondary);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    /* Notificação Toast Flutuante */
    .toast-notice {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background-color: var(--color-surface);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90vw;
    }

    .toast-notice.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Rodapé */
    .site-footer {
      border-top: 1px solid var(--color-border);
      margin-top: auto;
      padding: 40px 0 48px 0;
      color: var(--color-text-tertiary);
      font-size: 13px;
    }

    .site-footer-inner {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .site-footer-inner {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    /* Animação do Spinner */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-spin {
      animation: spin 0.9s linear infinite;
    }

    /* Respeito a prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="editorial-container site-header-inner">
      <!-- Marca -->
      <a href="/" class="brand-logo" aria-label="BREVE. Resumo Matinal - Início">
        BREVE<span class="brand-dot">.</span>
      </a>

      <!-- Navegação Editorial -->
      <nav class="header-nav" aria-label="Navegação Principal">
        <a href="/" class="nav-pill {% if request.url.path == '/' %}active{% endif %}">Hoje</a>
        <a href="/arquivo" class="nav-pill {% if request.url.path == '/arquivo' %}active{% endif %}">Histórico</a>
      </nav>

      <!-- Ações: Alternador de Tema e Atualizar -->
      <div class="header-actions">
        <!-- Botão Atualizar -->
        <button id="refreshBtn" onclick="triggerUpdate()" class="icon-btn" aria-label="Atualizar notícias com IA" title="Atualizar notícias com IA">
          <svg id="refreshIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
          </svg>
        </button>

        <!-- Botão Alternador de Tema -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="icon-btn" aria-label="Alternar tema claro e escuro" title="Alternar tema claro e escuro">
          <!-- Ícone Sol (aparece no modo escuro) -->
          <svg id="sunIcon" style="display:none;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Ícone Lua (aparece no modo claro) -->
          <svg id="moonIcon" style="display:none;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="editorial-container" style="flex: 1; padding-top: 36px; padding-bottom: 64px;">
    {% block content %}{% endblock %}
  </main>

  <!-- Rodapé Editorial -->
  <footer class="site-footer">
    <div class="editorial-container site-footer-inner">
      <div>
        <p style="font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px;">BREVE<span style="color: var(--color-accent)">.</span></p>
        <p>Curadoria jornalística assistida por inteligência artificial. Sem clickbait, direto ao ponto.</p>
      </div>
      <div style="display: flex; gap: 16px;">
        <a href="/" style="color: var(--color-text-secondary); hover:color: var(--color-text-primary);">Hoje</a>
        <a href="/arquivo" style="color: var(--color-text-secondary); hover:color: var(--color-text-primary);">Histórico</a>
        <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;" style="color: var(--color-text-secondary);">Topo ↑</a>
      </div>
    </div>
  </footer>

  <!-- Toast de Notificação -->
  <div id="toastNotice" class="toast-notice" role="status" aria-live="polite">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMsg">Atualização em andamento...</span>
  </div>

  <script>
    /* ==========================================================================
       GESTÃO DE TEMA (Light / Dark)
       ========================================================================== */
    function updateThemeUI(theme) {
      const sun = document.getElementById('sunIcon');
      const moon = document.getElementById('moonIcon');
      if (!sun || !moon) return;
      if (theme === 'dark') {
        sun.style.display = 'block';
        moon.style.display = 'none';
      } else {
        sun.style.display = 'none';
        moon.style.display = 'block';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('breve_theme', next);
      updateThemeUI(next);
    }

    // Inicializa ícone correto
    document.addEventListener('DOMContentLoaded', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      updateThemeUI(current);
    });

    /* ==========================================================================
       FEEDBACK VISUAL & ATUALIZAÇÃO MANUAL COM IA
       ========================================================================== */
    function showToast(msg, isSuccess, isError) {
      const toast = document.getElementById('toastNotice');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      if (!toast || !toastMsg) return;

      toastMsg.innerText = msg;
      if (isSuccess) toastIcon.innerText = '✓';
      else if (isError) toastIcon.innerText = '✕';
      else toastIcon.innerText = '⏳';

      toast.classList.add('show');
      if (isSuccess || isError) {
        setTimeout(() => toast.classList.remove('show'), 4000);
      }
    }

    let isUpdating = false;

    async function triggerUpdate() {
      if (isUpdating) return;
      if (!confirm("Deseja buscar notícias e sintetizar com IA agora? O processo leva cerca de 20 a 30 segundos.")) return;

      isUpdating = true;
      const refreshBtn = document.getElementById('refreshBtn');
      const refreshIcon = document.getElementById('refreshIcon');
      const heroBtn = document.getElementById('heroGenBtn');

      if (refreshBtn) refreshBtn.disabled = true;
      if (refreshIcon) refreshIcon.classList.add('anim-spin');
      if (heroBtn) {
        heroBtn.disabled = true;
        heroBtn.innerText = 'Processando com IA... Aguarde.';
      }

      showToast("Iniciando curadoria com Google Gemini...", false, false);

      try {
        const res = await fetch('/api/trigger?force=true', { method: 'POST' });
        if (!res.ok) {
          const errData = await res.text();
          throw new Error("Erro do servidor: " + (errData || res.statusText));
        }

        showToast("Curando matérias com IA... (~20s)", false, false);

        // Polling para acompanhar término da curadoria
        const checkInterval = setInterval(async () => {
          try {
            const statusRes = await fetch('/api/status');
            if (statusRes.ok) {
              const statusData = await statusRes.json();
              if (!statusData.is_curating) {
                clearInterval(checkInterval);
                showToast("Edição atualizada com sucesso!", true, false);
                setTimeout(() => window.location.reload(), 900);
              }
            }
          } catch (pollErr) {
            console.error("Erro na verificação de status:", pollErr);
          }
        }, 2500);

      } catch (e) {
        showToast("Erro ao disparar: " + e.message, false, true);
        isUpdating = false;
        if (refreshBtn) refreshBtn.disabled = false;
        if (refreshIcon) refreshIcon.classList.remove('anim-spin');
        if (heroBtn) {
          heroBtn.disabled = false;
          heroBtn.innerText = 'Gerar Edição de Hoje';
        }
      }
    }
  </script>
</body>
</html>
