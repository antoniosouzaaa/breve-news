services:
  - type: web
    name: morning-briefing
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        value: antoniosouza1997@gmail.com
      - key: APP_BASE_URL
        sync: false
      - key: TIMEZONE
        value: America/Sao_Paulo
